name: ecommerce
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  dio: ^5.10.0
  logger: ^2.7.0
  dartz: ^0.10.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  carousel_slider: ^5.1.2
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.0
  build_runner: ^2.15.1


flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/images/

  
icons_launcher:
  image_path: "assets/images/splash.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true